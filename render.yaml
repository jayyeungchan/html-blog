services:
  - type: web
    name: html-blog
    runtime: static
    buildCommand: node build.js
    staticPublishPath: .
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 20.11.1
    headers:
      - path: /articles.json
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /sitemap.xml
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600, must-revalidate
